# Los secretos NO van en este archivo. Se leen de variables de entorno o de un
# archivo ".env" en la raíz del proyecto (ignorado por Git). Ver ".env.example".
spring.config.import=optional:file:.env[.properties]
spring.application.name=Notas_Trinitario
spring.datasource.url=jdbc:mysql://localhost:3306/db_notastrinitario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Credenciales de Gmail: variables MAIL_USERNAME / MAIL_PASSWORD (o archivo .env).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.expiration=604800000
app.institution.name=Corporación Colegio Trinitario
app.institution.address=Cra 81C #22-124, San Fernando, Cartagena de Indias, Bolívar
app.institution.logo=Logo Colegio.png
# Carpeta donde se guardan los boletines generados. Si se OMITE, se usa una
# ruta PORTÁTIL relativa a la ubicación de la app (al lado del JAR / raíz del
# proyecto), así funciona aunque se mueva la app a otra máquina o a un USB.
# Para fijarla en un lugar concreto, descomenta y pon una ruta absoluta:
# boletines.output-dir=C:/ruta/absoluta/Boletines Generados
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
server.port=8080
# ── Tailscale Funnel ───────────────────────────────────────────────────
# Dominio público que te asigna Tailscale (sin "/" al final). Descomenta la
# línea y pon el tuyo; también sirve la variable de entorno
# APP_SECURITY_ALLOWED_ORIGINS. Sin esto, Spring responde 403 (CORS) a las
# peticiones que llegan por el túnel.
# app.security.allowed-origins=https://TU-PC.TU-RED.ts.net
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/static/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0
logging.level.org.springframework.web=DEBUG
app.jwt.secret=${JWT_SECRET}
# ── IA (generación de planes de estudio) ──────────────────────────────
# Key de Mistral (planes de estudio; el backend la usa como proxy).
# Ya NO va escrita aquí: defínela en la variable de entorno MISTRAL_API_KEY.
app.ai.mistral-api-key=${MISTRAL_API_KEY:}
app.ai.mistral-model=mistral-large-2512
app.ai.mistral-url=https://api.mistral.ai/v1/chat/completions
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false